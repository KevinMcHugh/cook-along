<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Recipe Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700;900&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2244%22 fill=%22%23e4572e%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="edit.css">
<script type="module" src="src/edit.js"></script>
</head>
<body>
<header>
  <p class="eyebrow">Cook-Along</p>
  <h1>Recipe editor</h1>
</header>

<main>
  <section class="panel">
    <h2><span class="num">1</span> Copy from</h2>
    <p class="hint">Paste a cook-along link, a token, or recipe JSON.</p>
    <div class="row">
      <textarea id="source" rows="2" spellcheck="false" placeholder="https://…/#token=eyJ…"></textarea>
    </div>
    <div class="row buttons">
      <button type="button" class="btn primary" id="loadBtn">Load</button>
      <button type="button" class="btn" id="exampleBtn">Load example</button>
      <button type="button" class="btn" id="blankBtn">Blank recipe</button>
    </div>
    <p class="msg" id="loadMsg" role="status"></p>
  </section>

  <section class="panel">
    <h2><span class="num">2</span> Edit</h2>
    <p class="hint">Format: <a href="schema/recipe.schema.json" target="_blank" rel="noopener">recipe.schema.json</a>. Checked as you type.</p>
    <textarea id="json" class="code" spellcheck="false" aria-label="Recipe JSON" aria-describedby="status"></textarea>
    <div class="row buttons">
      <button type="button" class="btn" id="formatBtn">Format</button>
      <span class="status" id="status" role="status"></span>
    </div>
    <ul class="errors" id="errors"></ul>
  </section>

  <section class="panel">
    <h2><span class="num">3</span> Copy to</h2>
    <input id="link" class="code" readonly aria-label="Cook-along link" placeholder="Fix the errors above to get a link">
    <div class="row buttons">
      <button type="button" class="btn primary" id="copyLinkBtn" disabled>Copy link</button>
      <a class="btn" id="openBtn" target="_blank" rel="noopener" aria-disabled="true">Open</a>
      <button type="button" class="btn" id="copyJsonBtn">Copy JSON</button>
      <span class="status" id="linkInfo"></span>
    </div>
  </section>
</main>
</body>
</html>
